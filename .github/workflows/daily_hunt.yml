name: Daily Job Hunt

on:
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EMBEDDING_API_KEY }}
          GEMINI_REASONING_API_KEY: ${{ secrets.GEMINI_REASONING_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          GEMINI_REASONING_MODEL: ${{ secrets.GEMINI_REASONING_MODEL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # v3.6: WWR default OFF (account wall). Untuk mengaktifkan: repo Settings ->
          # Secrets and variables -> Actions -> Variables -> tambah ENABLE_WWR = 1
          ENABLE_WWR: ${{ vars.ENABLE_WWR }}
        run: python ingest.py

      - name: Run Matching
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EMBEDDING_API_KEY }}
          GEMINI_REASONING_API_KEY: ${{ secrets.GEMINI_REASONING_API_KEY }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
          GEMINI_REASONING_MODEL: ${{ secrets.GEMINI_REASONING_MODEL }}
        run: python main.py

      - name: Run Notifier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # v3.7: resolver jalur apply (cross-post butuh JSearch; matikan via
          # repo variable RESOLVE_APPLY_LINKS=0 bila tidak diinginkan)
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RESOLVE_APPLY_LINKS: ${{ vars.RESOLVE_APPLY_LINKS }}
        run: python notifier.py

      # v3.5: kalau run GAGAL (error kode, Supabase down, kuota habis, dsb.),
      # kirim alert ke Telegram — tool tanpa pengawasan harus bisa "teriak".
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🚨 AI Career Architect: run GAGAL. Cek log: https://github.com/grenitho/ai-career-architect/actions/runs/${{ github.run_id }}\",\"disable_web_page_preview\":true}" \
              > /dev/null || true
          fi